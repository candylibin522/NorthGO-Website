<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Northgo 詢問管理</title>
  <link rel="icon" href="/office-assets/northgo.png">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="/zh-tw/index.html" aria-label="Northgo 首頁"><img src="/site-assets/northgo-logo.svg" alt="Northgo" width="160" height="32"></a>
    <span>詢問管理</span>
    <div id="accountActions" class="account-actions" hidden>
      <a href="#users" id="usersLink" hidden>使用者管理</a>
      <span id="username"></span>
      <button id="changePassword" type="button">變更密碼</button>
      <button id="logout" type="button">登出</button>
    </div>
  </header>
  <main>
    <section id="authView" class="auth-view">
      <h1 id="authTitle">管理者登入</h1>
      <p id="authDescription">載入中…</p>
      <form id="authForm" hidden>
        <label>帳號<input name="username" autocomplete="username" required minlength="3" maxlength="100" spellcheck="false"></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <label id="confirmLabel" hidden>確認密碼<input name="confirm" type="password" autocomplete="new-password" maxlength="256"></label>
        <button id="authSubmit" type="submit" class="primary">登入</button>
      </form>
      <p id="authMessage" class="message" role="status"></p>
      <button id="retryAuth" type="button" hidden>重新連線</button>
    </section>
    <section id="appView" hidden>
      <div class="page-heading"><h1>客戶詢問</h1><div class="actions"><button id="createEnquiry" class="primary" type="button">新增詢問</button><button id="refresh" type="button" title="重新整理詢問清單">重新整理</button></div></div>
      <div id="counts" class="counts" aria-label="詢問狀態統計"></div>
      <form id="filters" class="filters" role="search">
        <label class="search">搜尋<input name="search" type="search" placeholder="姓名、公司、Email 或收件編號"></label>
        <label>處理狀態<select name="state"><option value="">所有狀態</option><option value="new">待處理</option><option value="processing">處理中</option><option value="replied">已回覆</option><option value="archived">已封存</option></select></label>
        <label>服務<select name="service"><option value="">所有服務</option></select></label>
        <label>據點<select name="recipient"><option value="">所有據點</option></select></label>
        <label>資料範圍<select name="deleted"><option value="active">目前詢問</option><option value="deleted">回收筒</option></select></label>
      </form>
      <p id="listMessage" class="message" role="status"></p>
      <div class="workspace">
        <section class="inbox" aria-label="詢問清單">
          <div class="table-scroll">
            <table>
              <thead><tr><th scope="col">公司</th><th scope="col">聯絡人</th><th scope="col">服務</th><th scope="col">據點</th><th scope="col">狀態</th><th scope="col">收到時間</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <p id="empty" class="empty" hidden>尚未收到詢問。</p>
          <div class="pagination"><span id="pageInfo" aria-live="polite"></span><button id="previous" type="button" aria-label="上一頁">←</button><button id="next" type="button" aria-label="下一頁">→</button></div>
        </section>
        <section id="detail" class="detail" aria-label="詢問詳情"><p class="empty">請選擇一筆詢問。</p></section>
      </div>
    </section>
    <section id="usersView" hidden aria-label="使用者管理">
      <div class="page-heading">
        <div><h1>使用者管理</h1><a href="#inquiries">返回客戶詢問</a></div>
        <button id="addUser" type="button" class="primary">新增使用者</button>
      </div>
      <p id="usersMessage" class="message" role="status"></p>
      <div class="inbox table-scroll">
        <table>
          <thead><tr><th scope="col">帳號</th><th scope="col">角色</th><th scope="col">詢問權限</th><th scope="col">狀態</th><th scope="col">操作</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>Northgo <span id="version"></span></footer>
  <dialog id="userDialog">
    <form id="userForm">
      <h2 id="userDialogTitle">新增使用者</h2>
      <label>帳號<input name="username" required minlength="3" maxlength="100" pattern="[a-zA-Z0-9_.@\-]{3,100}" autocomplete="off"></label>
      <label>角色<select name="role"><option value="viewer">唯讀人員</option><option value="manager">詢問管理員</option></select></label>
      <p id="roleDescription" class="muted"></p>
      <label id="userEnabled">帳號狀態<select name="enabled"><option value="true">啟用</option><option value="false">停用</option></select></label>
      <label><span id="teamPasswordLabel">初始密碼</span><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256"></label>
      <p id="userFormMessage" class="message" role="status"></p>
      <div class="actions"><button type="submit" class="primary">儲存</button><button id="cancelUser" type="button">取消</button></div>
    </form>
  </dialog>
  <dialog id="createDialog">
    <form id="createForm">
      <h2>新增客戶詢問</h2>
      <div id="createFields" class="edit-grid"></div>
      <p id="createMessage" class="message" role="status"></p>
      <div class="actions"><button type="submit" class="primary">建立詢問</button><button id="cancelCreate" type="button">取消</button></div>
    </form>
  </dialog>
  <dialog id="passwordDialog">
    <form id="passwordForm">
      <h2>變更密碼</h2>
      <label>目前密碼<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="256"></label>
      <label>新密碼<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label>
      <label>確認新密碼<input name="confirm" type="password" autocomplete="new-password" required maxlength="256"></label>
      <p class="muted">密碼至少 12 字元。變更後請重新登入。</p>
      <p id="passwordMessage" class="message" role="status"></p>
      <div class="actions"><button type="submit" class="primary">儲存新密碼</button><button id="cancelPassword" type="button">取消</button></div>
    </form>
  </dialog>
</body>
</html>
