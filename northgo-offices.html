<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northgo 全球辦公室</title>
<link rel="stylesheet" href="office-assets/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,"Segoe UI",sans-serif;color:#172f29;background:#fff;letter-spacing:0}a{color:#12684c;text-underline-offset:3px}button,select{font:inherit}header{padding:24px 32px;border-bottom:1px solid #dce4df;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:750;text-decoration:none;color:#172f29;display:flex;gap:10px;align-items:center}.brand img{width:32px;height:32px}h1{font-size:27px;line-height:1.3;margin:0}header p{margin:4px 0 0;color:#607169;font-size:14px}.toolbar{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #dce4df;background:#f5f8f6}.toolbar label{display:flex;align-items:center;gap:12px;font-weight:600}select{background:white;border:1px solid #acbfb4;border-radius:4px;padding:8px 34px 8px 12px;min-width:180px;color:#172f29}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:620px}.mapwrap{position:relative;min-width:0;background:#dce8ec}#map{height:calc(100dvh - 207px);min-height:620px;width:100%;background:#dce8ec}.sidebar{height:calc(100dvh - 207px);min-height:620px;overflow:auto;border-left:1px solid #dce4df}.sidebar h2{font-size:17px;margin:0;padding:18px 22px;border-bottom:1px solid #dce4df}.office{padding:18px 22px;border-bottom:1px solid #dce4df}.office.selected{background:#eef6f0;border-left:4px solid #12684c;padding-left:18px}.office button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:#172f29;width:100%;font-weight:700;font-size:16px}.index{display:inline-grid;place-items:center;width:25px;height:25px;flex-shrink:0;background:#12684c;color:#fff;border-radius:50%;font-size:12px}.country{font-size:12px;color:#6c7f76;margin:5px 0 8px}.office p{margin:7px 0;font-size:13px;overflow-wrap:anywhere}.office .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.office .actions a{font-size:13px}.pin{display:grid;place-items:center;width:25px;height:25px;background:#12684c;border:2px solid white;border-radius:50%;color:#fff;font-weight:700;font-size:12px;box-shadow:0 2px 7px #0004}.pin.hq{background:#b45927}.city-label{background:white!important;color:#193e30!important;border:1px solid #bdcfc4!important;border-radius:3px!important;box-shadow:none!important;font:600 12px system-ui!important;padding:4px 7px!important}.city-label:before{display:none}.leaflet-popup-content{font:14px/1.5 system-ui;max-width:240px;overflow-wrap:anywhere}.leaflet-popup-content strong{font-size:17px}.leaflet-popup-content p{margin:7px 0}.legend{position:absolute;z-index:500;left:12px;bottom:30px;background:#fff;padding:7px 10px;font-size:12px;border:1px solid #dce4df;pointer-events:none}.dot{display:inline-block;width:9px;height:9px;background:#12684c;border-radius:50%;margin:0 5px 0 10px}.dot:first-child{margin-left:0}.dot.hq{background:#b45927}#notice{position:absolute;z-index:600;top:12px;left:60px;right:12px;padding:10px 14px;background:#fff6dc;border:1px solid #dcc387;font-size:13px}footer{font-size:12px;color:#607169;padding:14px 32px;border-top:1px solid #dce4df}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d28b36;outline-offset:3px}[hidden]{display:none!important}@media(max-width:800px){header{padding:18px;align-items:flex-start}.brand{font-size:20px}.brand img{width:26px;height:26px}h1{font-size:22px}.toolbar{padding:14px 18px}.toolbar label{gap:8px}select{min-width:140px}.layout{grid-template-columns:1fr;min-height:0}#map{height:480px;min-height:0}.sidebar{height:auto;min-height:0;border-left:0}.offices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.office{padding:18px;border-right:1px solid #dce4df}.office.selected{padding-left:14px}footer{padding:14px 18px}}@media(max-width:480px){header{flex-direction:column;gap:10px}.toolbar{flex-wrap:wrap}#map{height:430px}.offices{grid-template-columns:1fr}.office{border-right:0}header p{font-size:13px}}
</style>
<style>
:root{color-scheme:dark;--navy:#13264b;--deep:#0a1b33;--teal:#00e5e5;--light:#edfcfc;--muted:#a3f0f0;--border:#365477}
body,footer,.mapwrap,#map{background:var(--deep);color:var(--light)}
header,.toolbar,.sidebar,.toolbar select,.legend,#notice{background:var(--navy);color:var(--light)}
header,.toolbar,.sidebar,.sidebar h2,.office,.toolbar select,.legend,#notice,footer{border-color:var(--border)}
header p,.country,footer{color:var(--muted)}
a,.leaflet-container a,.brand,.office button{color:var(--light)}
a,.leaflet-container a{color:var(--teal)}
button:focus-visible,select:focus-visible,a:focus-visible{outline-color:var(--teal)}
@media(min-width:481px) and (max-width:800px){.offices{grid-template-columns:1fr}}
.office.selected{background:#173657;border-left-color:var(--teal)}
.index,.pin,.pin.hq,.dot,.dot.hq{background:var(--teal);color:var(--deep);border-color:var(--deep)}
.pin.hq,.dot.hq{background:var(--muted)}
.city-label{background:var(--navy)!important;color:var(--light)!important;border-color:var(--border)!important}
.leaflet-countries-pane path{fill:var(--navy)!important;stroke:var(--border)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-control-scale-line{background:var(--navy);color:var(--light)}
.leaflet-control-zoom a,.leaflet-control-attribution{background:var(--navy)!important;color:var(--light)!important;border-color:var(--border)!important}
</style>
</head>
<body>
<header><span class="brand"><img src="office-assets/northgo.png" alt="">Northgo</span><div><h1>全球辦公室</h1><p>Our global offices</p></div></header>
<div class="toolbar"><label for="region">區域<select id="region"><option value="world">全球</option><option value="asia">亞洲</option><option value="us">北美</option><option value="tw">台灣</option><option value="jp">日本</option><option value="vn">越南</option></select></label><span id="count" aria-live="polite">7 個辦公室 · 4 個國家／地區</span></div>
<main class="layout"><section class="mapwrap" aria-label="辦公室分布地圖"><div id="map" aria-label="世界地圖"></div><p id="notice" hidden role="status"></p><div class="legend"><span class="dot hq"></span>總部<span class="dot"></span>辦公室</div></section><aside class="sidebar" aria-label="辦公室聯絡資訊"><h2 id="listTitle">全部辦公室</h2><div id="offices" class="offices"></div></aside></main>
<footer>資料來源：Northgo 官網聯絡頁（Our global offices） · 核對日期 2026-11-11。標記為城市概略位置，完整地址請見辦公室資訊。地圖資料：Natural Earth。</footer>
<script src="office-assets/leaflet.js"></script>
<script src="office-assets/countries.js"></script>
<script>
const offices=[
{id:1,name:'台北',en:'Taipei',region:'tw',country:'台灣',hq:true,lat:25.062,lng:121.538,address:'7F., No. 10, Sec. 3, Minsheng E. Rd., Taipei City 104511, Taiwan',tel:'+886-2-2531-8677',fax:'+886-2-2531-8577',email:'info.tpe@northgo.com',offset:[-55,-62]},
{id:2,name:'台中',en:'Taichung',region:'tw',country:'台灣',lat:24.288,lng:120.523,address:'No. 4, Zhongheng 11th Rd., Taichung City 435058, Taiwan',tel:'+886-4-2326-2580',fax:'+886-4-2326-0308',email:'info.txg@northgo.com',offset:[-65,-8]},
{id:3,name:'高雄',en:'Kaohsiung',region:'tw',country:'台灣',lat:22.616,lng:120.296,address:'19F-2, No.31 Hai-Pien Rd., Kaohsiung City 802609, Taiwan',tel:'+886-7-335-0730',fax:'+886-7-336-4536',email:'info.khh@northgo.com',offset:[-20,48]},
{id:4,name:'洛杉磯',en:'Los Angeles',region:'us',country:'美國',lat:34.062,lng:-118.134,address:'119 S. Atlantic Blvd, Ste#301, Monterey Park, CA 91754, USA',tel:'+1-714-853-1088',email:'info.lax@northgo.com',offset:[0,0]},
{id:5,name:'胡志明市',en:'Ho Chi Minh',region:'vn',country:'越南',lat:10.795,lng:106.719,address:'5th Floor, No. 92D Nguyen Huu Canh Street, Ward 22, Binh Thanh District, Ho Chi Minh City, Vietnam',tel:'+84-28-9995-7368',email:'info.hcmc@northgo.com',offset:[-90,85]},
{id:6,name:'東京',en:'Tokyo',region:'jp',country:'日本',lat:35.672,lng:139.773,address:'104-0041 6FL., Gran+Ginza-East, 1-5-1 Shintomi, Chuo-Ku, Tokyo City, Japan',tel:'+81-3-6260-3944',fax:'+81-3-6260-3945',email:'info.tyo@northgo.com',offset:[38,-55]},
{id:7,name:'大阪',en:'Osaka',region:'jp',country:'日本',lat:34.699,lng:135.495,address:'530-0002 3FL., -B MF Sakura-Bashi Build, 2-6-23 Sonezaki Shinchi, kita-ku, Osaka City, Japan',tel:'+81-6-6676-8395',fax:'+81-6-6676-8397',email:'info.osa@northgo.com',offset:[35,4]}
];
const region=document.getElementById('region'),list=document.getElementById('offices'),notice=document.getElementById('notice');let map,markers=new Map(),layers,current=offices,selected=null;
function info(o){return '<strong>'+o.name+(o.hq?'（總部）':'')+'</strong><p>'+o.address+'</p><p><a href="tel:'+o.tel+'">'+o.tel+'</a><br><a href="mailto:'+o.email+'">'+o.email+'</a></p>';}
function drawList(){list.replaceChildren();current.forEach(o=>{const article=document.createElement('article');article.className='office';article.dataset.id=o.id;article.innerHTML='<button type="button" aria-label="查看'+o.name+'辦公室"><span class="index">'+o.id+'</span>'+o.name+(o.hq?' · 總部':'')+'</button><div class="country">'+o.country+' / '+o.en+'</div><p>'+o.address+'</p><p>Tel <a href="tel:'+o.tel+'">'+o.tel+'</a>'+(o.fax?'<br>Fax '+o.fax:'')+'</p><p><a href="mailto:'+o.email+'">'+o.email+'</a></p>';article.querySelector('button').addEventListener('click',()=>focusOffice(o));list.append(article);});}
function selectOffice(o,scroll){selected=o.id;list.querySelectorAll('.office').forEach(el=>el.classList.toggle('selected',Number(el.dataset.id)===o.id));if(scroll)list.querySelector('[data-id="'+o.id+'"]').scrollIntoView({behavior:'smooth',block:'nearest'});}
function coord(o){return [o.lat,o.lng<0?o.lng+360:o.lng];}
function focusOffice(o){selectOffice(o,false);if(map){map.setView(coord(o),8,{animate:false});markers.get(o.id)?.openPopup();document.getElementById("map").scrollIntoView({block:"nearest"});}}
function drawMarkers(){if(!map)return;layers.clearLayers();markers.clear();const size=map.getSize();current.forEach((o,i)=>{const actual=L.latLng(coord(o));const y=current.length===1?size.y/2:size.y*(0.18+0.64*i/(current.length-1));const labelPoint=L.point(size.x*0.52,y);const markerPosition=map.layerPointToLatLng(labelPoint);L.polyline([actual,markerPosition],{color:'#00e5e5',weight:1,opacity:0.8,interactive:false}).addTo(layers);L.circleMarker(actual,{radius:3,color:'#a3f0f0',weight:1,fillColor:'#a3f0f0',fillOpacity:1,interactive:false}).addTo(layers);const m=L.marker(markerPosition,{icon:L.divIcon({className:'',html:'<span class="pin'+(o.hq?' hq':'')+'">'+o.id+'</span>',iconSize:[25,25],iconAnchor:[12,12]}),title:o.name+'辦公室',alt:o.name+'辦公室'}).addTo(layers).bindTooltip(o.name,{permanent:true,direction:'right',offset:[8,0],className:'city-label'}).bindPopup(info(o));m.on('click',()=>selectOffice(o,true));markers.set(o.id,m);});}
function update(){selected=null;current=offices.filter(o=>region.value==='world'||region.value==='asia'&&o.region!=='us'||o.region===region.value);document.getElementById('count').textContent=current.length+' 個辦公室 · '+new Set(current.map(o=>o.country)).size+' 個國家／地區';document.getElementById('listTitle').textContent=region.options[region.selectedIndex].text+'辦公室';drawList();if(map){map.closePopup();if(region.value==='world')map.fitBounds([[-45,-20],[68,340]],{padding:[30,30]});else if(current.length===1)map.setView(coord(current[0]),9);else map.fitBounds(current.map(coord),{padding:[60,60],maxZoom:8});drawMarkers();}}
region.addEventListener('change',update);
if(window.L){map=L.map('map',{minZoom:1,maxZoom:18,zoomSnap:0.25,fadeAnimation:false});map.createPane('countries');map.getPane('countries').style.zIndex=190;if(window.worldCountries){for(const shift of [0,360])L.geoJSON(window.worldCountries,{pane:'countries',interactive:false,style:{color:'#afc6bc',weight:0.7,fillColor:'#f4f7f2',fillOpacity:1},coordsToLatLng:c=>L.latLng(c[1],c[0]+shift)}).addTo(map);map.attributionControl.setPrefix('Leaflet').addAttribution('Natural Earth');}layers=L.layerGroup().addTo(map);L.control.scale({imperial:false}).addTo(map);map.on('zoomend',drawMarkers);map.on('resize',()=>{if(region.value==='world')update();});}else{notice.hidden=false;notice.textContent='無法載入地圖程式。仍可查看辦公室清單及聯絡資訊。';}
update();
</script>
</body>
</html>
