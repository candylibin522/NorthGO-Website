const compact=new URLSearchParams(location.search).get('view')==='tree';document.body.classList.toggle('compact',compact);const select=document.getElementById('locale'),search=document.getElementById('search');select.value=new URLSearchParams(location.search).get('lang')||'zh';if(!sitemapLocales[select.value])select.value='zh';let t;
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function itemNode(item,parent){const li=el('li');const path=t.prefix+((item.p||parent)==='/'?'':(item.p||parent));const url=(path||'/')+(item.h?'#'+item.h:'');li.dataset.search=[t.names[item.n],url,item.h||''].join(' ').toLowerCase();li.append(el('span',t.names[item.n]));if(!compact&&!item.error)li.append(el('span',item.h?t.ui[6]:t.ui[5],'badge'));if(!compact)li.append(el('span',url,'path'));if(item.children){const ul=el('ul',null,'children');item.children.forEach(c=>ul.append(itemNode(c,item.p)));li.append(ul);}return li;}
function render(){t=sitemapLocales[select.value];document.documentElement.lang=t.lang;document.querySelector('nav').setAttribute('aria-label',t.ui[0]);document.title='Northgo · '+t.ui[0];document.getElementById('heading').textContent=t.ui[0]+(compact?' · '+t.ui[11]:'');document.getElementById('subtitle').textContent=t.ui[1];document.getElementById('searchLabel').firstChild.textContent=t.ui[2];document.getElementById('localeLabel').firstChild.textContent=t.ui[3];search.placeholder=t.ui[2];document.getElementById('home').textContent=t.ui[4];const stats=document.getElementById('stats');stats.replaceChildren();[[4,0],[44,1],[7,3]].forEach(([n,i])=>{const s=el('span');s.append(el('strong',String(n)),document.createTextNode(t.stats[i]));stats.append(s);});const map=document.getElementById('map');map.replaceChildren();sitemapGroups.forEach((g,i)=>{const s=el('section');s.append(el('h2',t.groups[i]));const ul=el('ul',null,'tree');g.items.forEach(item=>ul.append(itemNode(item)));s.append(ul);map.append(s);});const note=document.getElementById('note');note.replaceChildren(el('h2',t.ui[10]));const ul=el('ul');t.notes.forEach(n=>ul.append(el('li',n)));note.append(ul);document.getElementById('footer').textContent=t.footer;document.getElementById('empty').textContent=t.ui[8];const other=document.getElementById('other');other.textContent=compact?t.ui[12]:t.ui[11];other.href='?lang='+select.value+(compact?'':'&view=tree');filter();}
function filter(){const q=search.value.trim().toLowerCase();let total=0;document.querySelectorAll('#map section').forEach(s=>{let visible=0;s.querySelectorAll('.tree>li').forEach(li=>{const match=li.dataset.search.includes(q);let child=false;li.querySelectorAll('.children>li').forEach(c=>{c.hidden=!(match||c.dataset.search.includes(q));child=child||!c.hidden;});li.hidden=!(match||child);if(!li.hidden){visible++;total++;}});s.hidden=!visible;});document.getElementById('empty').hidden=total>0;document.getElementById('result').textContent=q?t.ui[9]+': '+total:'';}
