name: Deploy Northgo to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build static website
        run: node build-northgo.mjs
        env:
          NORTHGO_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NORTHGO_STATIC_HOSTING: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: northgo-site
      - uses: actions/deploy-pages@v4
        id: deployment
